spring.application.name=demo-test

# In-memory H2 database with MySQL compatibility mode for fast, isolated tests
spring.datasource.url=jdbc:h2:mem:expensedb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Actuator for test verification
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

app.admin.username=admin
app.admin.password=admin123
