<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="Style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    
</head>

<body>

    <!-- AUTH PAGE -->
    <div id="authPage">

        <h1>💰 Smart Expense Tracker</h1>

        <div class="form-container">

            <button
                class="tab-btn login-tab"
                onclick="showTab('login')">

                Login

            </button>

            <button
                class="tab-btn register-tab"
                onclick="showTab('register')">

                Register

            </button>

            <!-- LOGIN -->
            <div id="loginForm">

                <h2>Login</h2>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Username"
                />

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                />

                <button
                    class="login-tab"
                    onclick="login()">

                    Login

                </button>

            </div>

            <!-- REGISTER -->
            <div id="registerForm" style="display:none;">

                <h2>Register</h2>

                <input
                    type="text"
                    id="regUsername"
                    placeholder="Username"
                />

                <input
                    type="password"
                    id="regPassword"
                    placeholder="Password"
                />

                <button
                    class="register-tab"
                    onclick="register()">

                    Register

                </button>

            </div>

            <p id="errorMsg"></p>

        </div>

    </div>

    <!-- APP PAGE -->
    <div id="appPage">

        <h1>💰 Smart Expense Tracker</h1>

        <p id="welcomeMsg"></p>

        <button id="logoutBtn" onclick="logout()">
            Logout
        </button>

        <!-- EXPENSE FORM -->
        <div
            class="form-container"
            id="expenseFormContainer">

            <h2 id="formTitle">Add Expense</h2>

            <input
                type="text"
                id="title"
                placeholder="Expense Title"
            />

            <select id="category">

                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Education">Education</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>

            </select>

            <input
                type="number"
                id="amount"
                placeholder="Amount"
            />

            <button
                id="submitBtn"
                onclick="addExpense()">

                Add Expense

            </button>

            <button
                id="cancelEdit"
                onclick="cancelEdit()">

                Cancel Edit

            </button>

        </div>

        <!-- CHART -->
        <div class="chart-container">

            <h3 style="text-align:center;">
                Spending by Category
            </h3>

            <canvas id="categoryChart"></canvas>

        </div>

        <!-- TABLE -->
        <h2>All Expenses</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="expenseTable"></tbody>

        </table>

        <!-- TOTAL -->
        <div id="totalBox">

            <strong>
                Total Expenses:
                <span id="totalAmount">Rs 0</span>
            </strong>

        </div>

    </div>

    <script>

        let editingId = null;

        // CHECK SESSION
        window.onload = function () {

            fetch('/me', {
                credentials: 'include'
            })

            .then(response => response.json())

            .then(data => {

                if (data.loggedIn) {

                    showApp(data.username);

                }

            });

        };

        // SWITCH TABS
        function showTab(tab) {

            document.getElementById('loginForm').style.display =
                tab === 'login' ? 'block' : 'none';

            document.getElementById('registerForm').style.display =
                tab === 'register' ? 'block' : 'none';

            document.getElementById('errorMsg').innerText = '';

        }

        // REGISTER
        function register() {

            const username =
                document.getElementById('regUsername').value;

            const password =
                document.getElementById('regPassword').value;

            fetch('/register', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                credentials: 'include',

                body: JSON.stringify({
                    username,
                    password
                })

            })

            .then(response => response.text())

            .then(result => {

                if (result === 'REGISTERED') {

                    document.getElementById('errorMsg').style.color =
                        'green';

                    document.getElementById('errorMsg').innerText =
                        'Registration successful. Please login.';

                    showTab('login');

                }

                else {

                    document.getElementById('errorMsg').style.color =
                        'red';

                    document.getElementById('errorMsg').innerText =
                        'Username already exists.';

                }

            });

        }

        // LOGIN
        function login() {

            const username =
                document.getElementById('loginUsername').value;

            const password =
                document.getElementById('loginPassword').value;

            fetch('/login', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                credentials: 'include',

                body: JSON.stringify({
                    username,
                    password
                })

            })

            .then(response => response.text())

            .then(result => {

                if (result === 'OK') {

                    showApp(username);

                }

                else {

                    document.getElementById('errorMsg').innerText =
                        'Invalid username or password';

                }

            });

        }

        // SHOW APP
        function showApp(username) {

            document.getElementById('authPage').style.display =
                'none';

            document.getElementById('appPage').style.display =
                'block';

            document.getElementById('welcomeMsg').innerText =
                'Welcome, ' + username + '!';

            loadExpenses();

        }

        // LOGOUT
        function logout() {

            fetch('/logout', {

                method: 'POST',
                credentials: 'include'

            })

            .then(() => {

                location.reload();

            });

        }

        // LOAD EXPENSES
        function loadExpenses() {

            fetch('/expenses', {
                credentials: 'include'
            })

            .then(response => response.json())

            .then(data => {

                const table =
                    document.getElementById('expenseTable');

                table.innerHTML = '';

                showChart(data);

                showTotal(data);

                data.forEach(expense => {

                    table.innerHTML += `

                        <tr>

                            <td>${expense.id}</td>

                            <td>${expense.title}</td>

                            <td>${expense.category}</td>

                            <td>Rs ${expense.amount}</td>

                            <td>

                                <button
                                    class="edit-btn"
                                    onclick="editExpense(
                                        ${expense.id},
                                        '${expense.title}',
                                        ${expense.amount},
                                        '${expense.category}'
                                    )">

                                    Edit

                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteExpense(${expense.id})">

                                    Delete

                                </button>

                            </td>

                        </tr>

                    `;

                });

            });

        }

        // ADD / UPDATE EXPENSE
        function addExpense() {

            const title =
                document.getElementById('title').value;

            const category =
                document.getElementById('category').value;

            const amount =
                document.getElementById('amount').value;

            const expenseData = {
                title,
                category,
                amount
            };

            // UPDATE
            if (editingId !== null) {

                fetch(`/expenses/${editingId}`, {

                    method: 'PUT',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    credentials: 'include',

                    body: JSON.stringify(expenseData)

                })

                .then(() => {

                    cancelEdit();

                    loadExpenses();

                });

            }

            // ADD
            else {

                fetch('/expenses', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    credentials: 'include',

                    body: JSON.stringify(expenseData)

                })

                .then(() => {

                    document.getElementById('title').value = '';
                    document.getElementById('category').value = '';
                    document.getElementById('amount').value = '';

                    loadExpenses();

                });

            }

        }

        // EDIT
        function editExpense(id, title, amount, category) {

            editingId = id;

            document.getElementById('title').value = title;
            document.getElementById('amount').value = amount;
            document.getElementById('category').value = category;

            document.getElementById('formTitle').innerText =
                'Edit Expense';

            document.getElementById('submitBtn').innerText =
                'Update Expense';

            document.getElementById('submitBtn').style.backgroundColor =
                '#FF9800';

            document.getElementById('cancelEdit').style.display =
                'block';

            // PERFECT SCROLL
            document.getElementById('expenseFormContainer')
                .scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });

        }

        // CANCEL EDIT
        function cancelEdit() {

            editingId = null;

            document.getElementById('title').value = '';
            document.getElementById('category').value = '';
            document.getElementById('amount').value = '';

            document.getElementById('formTitle').innerText =
                'Add Expense';

            document.getElementById('submitBtn').innerText =
                'Add Expense';

            document.getElementById('submitBtn').style.backgroundColor =
                '#4CAF50';

            document.getElementById('cancelEdit').style.display =
                'none';

        }

        // DELETE
        function deleteExpense(id) {

            fetch(`/expenses/${id}`, {

                method: 'DELETE',
                credentials: 'include'

            })

            .then(() => {

                loadExpenses();

            });

        }

        // CHART
        function showChart(data) {

            const categories = {};

            data.forEach(expense => {

                if (categories[expense.category]) {

                    categories[expense.category] +=
                        expense.amount;

                }

                else {

                    categories[expense.category] =
                        expense.amount;

                }

            });

            const labels = Object.keys(categories);

            const values = Object.values(categories);

            const ctx =
                document.getElementById('categoryChart')
                .getContext('2d');

            if (window.myChart) {

                window.myChart.destroy();

            }

            window.myChart = new Chart(ctx, {

                type: 'pie',

                data: {

                    labels: labels,

                    datasets: [{

                        data: values,

                        backgroundColor: [
                            '#4CAF50',
                            '#2196F3',
                            '#FF9800',
                            '#E91E63',
                            '#9C27B0',
                            '#00BCD4'
                        ]

                    }]

                }

            });

        }

        // TOTAL
        function showTotal(data) {

            let total = 0;

            data.forEach(expense => {

                total += Number(expense.amount);

            });

            document.getElementById('totalAmount').innerText =
                'Rs ' + total;

        }

    </script>

</body>

</html>
