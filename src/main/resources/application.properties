spring.application.name=demo

# Database — set SPRING_DATASOURCE_* in Vercel Environment Variables (cloud MySQL, not localhost)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expensedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.web.resources.static-locations=classpath:/static/

# Vercel sets PORT at runtime (default 80); local fallback is 8081
server.port=${PORT:8081}
server.address=0.0.0.0

# Faster cold starts on serverless
spring.main.lazy-initialization=true

# Graceful shutdown when Vercel sends SIGTERM
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
